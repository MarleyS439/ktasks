; Craft configuration of the Android release job (see build-apk.sh). Based on
; KDE's sysadmin/craft-ci qt6/CraftConfig.ini, without KDE's own code signing:
; the APK is signed with the KTasks release key afterwards.
[General]
Branch = master
ShallowClone = True

[Variables]
CreateCache = False
UseCache = True

[GeneralSettings]
General/KFHostToolingVersion = 6
Paths/KDEGitDir = ${Variables:Root}/downloads/git/
Paths/DownloadDir = ${Variables:Root}/downloads
Packager/CacheDir = ${Variables:Root}/cache
Packager/RepositoryUrl = https://files.kde.org/craft/Qt6/
Packager/UseCache = ${Variables:UseCache}
Packager/CreateCache = ${Variables:CreateCache}
Blueprints/BlueprintRoot = ${Variables:Root}/blueprints
ContinuousIntegration/Enabled = True
ContinuousIntegration/OutputOnFailure = True

[BlueprintSettings]
libs/qt.qtMajorVersion = 6
libs/qt5.ignored = True
libs/qt6/qtdoc.ignored = True
/.buildTests = False

[android-arm64-clang]
General/ABI = android-clang-arm64
General/AndroidAPI = 28
Compile/BuildType = MinSizeRel
Packager/Destination = ${Variables:Root}/apk
Packager/DownloadDebugSymbolsCache = False
Packager/PackageDebugSymbols = False

; 32-bit phones (e.g. Samsung Galaxy A01/A10 ship a 32-bit Android). KDE
; publishes no binary cache for this ABI: Craft builds Qt and KDE Frameworks
; from source, and the workflow keeps the result in the GitHub Actions cache.
[android-arm32-clang]
General/ABI = android-clang-arm32
General/AndroidAPI = 28
Compile/BuildType = MinSizeRel
Packager/Destination = ${Variables:Root}/apk
Packager/DownloadDebugSymbolsCache = False
Packager/PackageDebugSymbols = False
